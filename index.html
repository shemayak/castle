<style>
 #allOC ,#allYC{
  overflow-x: auto;
  white-space: nowrap;
}
.OFC, .YFC ,#discardPile , .YHC{
  width :12.5vw;
  max-height: 17vh;
}

    position: absolute;

    position: absolute;

<script type="module" >
import shuffle from 'https://esm.sh/lodash.shuffle';
function card(cardName = "card-back"){
  return `https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/_cards-svg/${cardName}.svg`;
}
const OFC1 = document.querySelector("#OFC1"); // capital O is oponent Y for yours ,F for floor ,
const OFC2 = document.querySelector("#OFC2"); // and C for card 
const OFC3 = document.querySelector("#OFC3"); 
const OFC4 = document.querySelector("#OFC4"); 

const YFC1 = document.querySelector("#YFC1"); 
const YFC2 = document.querySelector("#YFC2"); 
const YFC3 = document.querySelector("#YFC3"); 
const YFC4 = document.querySelector("#YFC4");
  
const YHC1 = document.querySelector("#YHC1"); 
let allCardsNames = [
    "2H", "3H", "4H", "5H", "6H", "7H", "8H", "9H", "10H", "JH", "QH", "KH", "AH", 
    "2S", "3S", "4S", "5S", "6S", "7S", "8S", "9S", "10S", "JS", "QS", "KS", "AS", 
    "2C", "3C", "4C", "5C", "6C", "7C", "8C", "9C", "10C", "JC", "QC", "KC", "AC", 
    "2D", "3D", "4D", "5D", "6D", "7D", "8D", "9D", "10D", "JD", "QD", "KD", "AD",
    "Joker1", "Joker2"
    ];
let value = [// the vlaues/ how good  of the cards the more vlaue lower index
"Joker","10","7","2","A","K","Q","J",
"9","8","6","5","4","3","2","1"];
allCardsNames = shuffle(allCardsNames);// mix deck 
console.log(allCardsNames);
let OHandCards = [];// oponents hand cards 
for(let i = 0; i < 8; i++){
   OHandCards[i] = allCardsNames.shift();// oponent picking from deck
    
}

OFC1.src = card(OHandCards.shift());// placing for botoms 
OFC2.src = card(OHandCards.shift());
OFC3.src = card(OHandCards.shift());
OFC4.src = card(OHandCards.shift());


let YHandCards = [];// your hand card 
for(let i = 0; i < 8; i++){
   YHandCards[i] = allCardsNames.shift();
    
}

YFC1.src = card(YHandCards.shift());
YFC2.src = card(YHandCards.shift());
YFC3.src = card(YHandCards.shift());
YFC4.src = card(YHandCards.shift());

YHC1.src = card(YHandCards.shift());
YHC2.src = card(YHandCards.shift());
YHC3.src = card(YHandCards.shift());
YHC4.src = card(YHandCards.shift());

</script>
