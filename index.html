<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/_cards-svg/card-back.svg" alt = "card" id= "discardPile">

    <div id = "YfloorC">

       <img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/_cards-svg/card-back.svg" alt = "card" id = "YHC1" class ="YHC">
    </div>

<style>
 #allOC ,#allYC{
  overflow-x: auto;
  white-space: nowrap;
}
.OFC, .YFC ,#discardPile , .YHC{
  width :12.5vw;
  max-height: 20vh;
}
#allYC{
    position: absolute;
    bottom: 5vh;
}


#discardPile {

    position: absolute;
    top: 30vh;
    left: calc(50vw - (12.5vw / 2));
    
}

</style>
<script type="module" >
import shuffle from 'https://esm.sh/lodash.shuffle';
function card(cardName = "card-back"){
  return `https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/_cards-svg/${cardName}.svg`;
}
const OC1 = document.querySelector("#OFC1"); 
const OC2 = document.querySelector("#OFC2"); 
const OC3 = document.querySelector("#OFC3"); 
const OC4 = document.querySelector("#OFC4"); 

let allCardsNames = [
    "2H", "3H", "4H", "5H", "6H", "7H", "8H", "9H", "10H", "JH", "QH", "KH", "AH", 
    "2S", "3S", "4S", "5S", "6S", "7S", "8S", "9S", "10S", "JS", "QS", "KS", "AS", 
    "2C", "3C", "4C", "5C", "6C", "7C", "8C", "9C", "10C", "JC", "QC", "KC", "AC", 
    "2D", "3D", "4D", "5D", "6D", "7D", "8D", "9D", "10D", "JD", "QD", "KD", "AD",
    "Joker1", "Joker2"
    ];
    
allCardsNames = shuffle(allCardsNames);
console.log(allCardsNames);
OC1.src = card(allCardsNames[0]);
OC2.src = card(allCardsNames[1]);
OC3.src = card(allCardsNames[2]);
OC4.src = card(allCardsNames[3]);
</script>
