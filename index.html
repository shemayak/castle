
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>castle-the card game</title>
</head>
<body>
<!--the next links are the link fro the back card img-->
<div id = "allOC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="OC1" class = " OC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="OC2" class = " OC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="OC3" class = " OC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="OC4" class = " OC">
</div>

<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card" id= "discardPile">

<div id = "allYC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="YC1" class = "YC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="YC2" class = "YC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="YC3" class = "YC">
<img src = "https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/card-back.svg" alt = "card"  id ="YC4" class = "YC">
</div>
<style>
 #allOC ,#allYC{
  overflow-x: auto;
  white-space: nowrap;
}
.OC, .YC{
  width :12.5vw;
}
#allYC{
    position: absolute;
    top: 90vh;
}


#discardPile {
    
    width: 12.5vw;
    position: absolute;
    top: 50vh;
    left: calc(50vw - (12.5vw / 2));
    
}

</style>
<script>
function card(cardName = "card-back"){
  return `https://cdn.jsdelivr.net/gh/shemayak/castle@refs/heads/main/cards-svg/${cardName}.svg`;
}
const OC1 = document.querySelector("#OC1"); 
const OC2 = document.querySelector("#OC2"); 
const OC3 = document.querySelector("#OC3"); 
const OC4 = document.querySelector("#OC4"); 
OC1.src = card();
OC2.src = card();
OC3.src = card();
OC4.src = card();
</script>
</body>
</html>
